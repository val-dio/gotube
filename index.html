<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoTube</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="phone.css">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <!-- head of website -->
<header>
  <div class="head">  <h1>GoTube</h1></div>

<div class="search-bar">
  <div class="sear-input">
  <input type="text" id="searchInput" class="searching" placeholder="Search  youtube videos here...">
    </div>
    <div class="search-button">
  <button type="submit" onclick="searchYouTube()">🔎</button>
  </div>
</div>
<button class="menu-button" onclick="Menu()"><span class="material-symbols-outlined">menu</span></button>

</header>
<!-- menu right side page -->
<div class="menu-page">
  <div class="menus">                                
     <a href="#"> HOME</a>                                
     <a><button onclick="changeTheme()">ChangeTheme</button></a>                                
     <a>Live chart</a>                                
     <a>Favourite</a>                                
     <a>About-us</a>                                
     <a>feedback & Help</a>  
     <a>Downlods</a>  
     <a>Sign in</a>  
     <a >Awards</a>  
     </div>                              
</div>

<!-- spin sectio -->
<div id="loadingSpinner" class="spinner" style="display: none;"></div>
  <!-- video display section -->

<div class="totorial">
  <!-- main video frame -->
  <div class="main-video">
     <iframe id="mainVideo" src="https://www.youtube.com/embed/QRqbFBDtIlo" allowfullscreen></iframe> 

  </div>

  <!-- right side videos -->
  <div class="videos">
    <div class="video-item" onclick="changeVideo('V4Xn23jeLiE')">
      <img src="https://img.youtube.com/vi/V4Xn23jeLiE/0.jpg" alt="Video 1">
    </div>
    <div class="video-item" onclick="changeVideo('Trw-TMlxiDo')">
      <img src="https://img.youtube.com/vi/Trw-TMlxiDo/0.jpg" alt="Video 1">
    </div>

    <div class="video-item" onclick="changeVideo('IpFX2vq8HKw')">
      <img src="https://img.youtube.com/vi/IpFX2vq8HKw/0.jpg" alt="Video 2">
    </div>

    <div class="video-item" onclick="changeVideo('7DfKtySRTT0')">
      <img src="https://img.youtube.com/vi/7DfKtySRTT0/0.jpg" alt="Video 3">
    </div>
  </div>
</div>

<script src="script.js"></script>
 <script src="menu.js"></script>
 
</body>
</html>
